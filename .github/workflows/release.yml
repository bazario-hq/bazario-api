# Publishes openapi.json as a release asset, so bazario-web can pin a version:
#   npm run api:sync -- --ref v1.2.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run openapi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" openapi.json \
            --title "$GITHUB_REF_NAME" --generate-notes
