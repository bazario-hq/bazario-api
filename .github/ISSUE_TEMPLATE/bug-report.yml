name: Bug report
description: Something does not behave as expected
title: "[Bug] "
labels: ["type/bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [dev, staging, prod-sim]
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, HAR files, logs
